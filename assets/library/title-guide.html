<h1>配信タイトルを考えるヒント</h1>
<p>配信の内容と初見の人が得られる楽しさを、短く伝えるための型です。</p>
<h2>タイトルの型</h2>
<ul><li>【初見】ゲーム名｜今日の目標をひとことで</li><li>参加歓迎｜視聴者と一緒に○○に挑戦</li><li>作業配信｜完成までゆっくり進めます</li><li>雑談｜今日あったことを聞いてください</li><li>歌枠｜リクエスト歓迎・テーマを添えて</li></ul>
<h2>公開前チェック</h2>
<ul><li>何をする配信かタイトルだけで伝わる</li><li>企画の期待を過度にあおらず、実際の内容と一致する</li><li>長い説明や関係のないタグを詰め込まない</li></ul>
<p class="note">例文はそのまま使うより、あなたの配信内容や言葉づかいに合わせて書き換えてください。</p>
